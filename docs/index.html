<script>
const week1 = [
{title:'Understand the receive path',short:'Architecture',owner:'Spencer + Sisi',goal:'Trace a quote from a sending computer to your application logic.',tasks:[['Draw the receive architecture','Explain NIC, optical module or cable, transceiver, PCS, MAC, and parser. Mark serial versus parallel signals, reusable IP, and your RTL.'],['Define one fixed-length message','Agree on fields, widths, offsets, byte order, units, and invalid-input behavior. Identify the application-payload boundary.'],['Review the format together','Freeze the format with Sisi. Both partners explain the receive path and the guarantees the future upstream adapter must provide.']],evidence:'An annotated receive-path sketch, glossary, nesting diagram, and versioned message field table.',question:'What would be missing if the transceiver output connected directly to your quote parser?'},
{title:'Build the Python reference',short:'Reference',owner:'Spencer · Python',goal:'Create an independently checked interpretation of your message before implementing RTL.',tasks:[['Decode one message by hand','Choose recognizable field values. Write the complete message in hexadecimal and annotate field boundaries and expected values.'],['Write and check the reference','Implement bytes-to-fields decoding. Compare with the hand-worked vector; include an independent check beyond an encoder/decoder round trip.'],['Specify rejected inputs','Check short and overlong messages, unsupported types, and a valid message following a rejection. Separate structural checks from application policy.']],evidence:'A manual test vector, checked Python reference, invalid-input expectations, and a reproducible command.',question:'If your encoder and decoder share the same mistake, what evidence would reveal it?'},
{title:'Define the stream contract',short:'Interface',owner:'Spencer + Sisi',goal:'Translate bytes into clock transfers and make the simulation environment reproducible.',tasks:[['Write the interface contract','Document the 32-bit local payload stream, valid, byte mask, final marker, final error, synchronous reset, and deterministic output latency.'],['Predict and drive the transfers','Split your message into transfers by hand. Mark lane order, input gaps, and output sampling edges. Launch cocotb and compare the stimulus trace.'],['Review hardware integration status','Sisi records IP configuration, port/lane, clocks/reset, tool and license access, working evidence, and blockers. Identify differences from the local stream.']],evidence:'A port table, cycle worksheet, runnable clock/reset/stimulus setup, trace, and partner-status note.',question:'With no input-ready signal, which clock edges count as accepted input transfers?'},
{title:'Implement and verify the parser',short:'Parser',owner:'Spencer · RTL + cocotb',goal:'Implement one message type and prove the documented output and recovery behavior.',tasks:[['Implement the frozen contract','Collect fields across transfers and emit one ordered decoded-valid result per accepted message, after the final error status is known.'],['Build self-checking simulation','Check fields, count, order, latency, reset, continuous input, gaps, final masks, malformed inputs, and malformed-to-valid recovery. Add bounded timeouts.'],['Inspect the trace and run lint','Explain the field-collection and output edges. Resolve meaningful width, signedness, initialization, assignment, and interface warnings.']],evidence:'Parser RTL, meaningful self-checking test results, a reproducible run, an annotated waveform, and lint dispositions.',question:'Which test shows that a bad final transfer cannot produce a committed quote?'},
{title:'Demonstrate and review',short:'Review',owner:'Spencer + Sisi',goal:'Show what works, name its limits, and agree on the next measurable milestone.',tasks:[['Reproduce a clean demonstration','Run the parser tests from a clean build. Show expected and actual decoded fields and explain the waveform.'],['Exchange the partner demonstrations','Explain the receive architecture without reading notes. Sisi demonstrates board progress and explains IP, clocks, reset, and remaining gaps.'],['Record evidence and next steps','Separate verified behavior, untested cases, assumptions, and blockers. Agree on a small Week 2 milestone. Synthesis and loopback are optional stretch work.']],evidence:'A clean parser demonstration, board-status review, known limits, and a joint next-milestone note.',question:'What does the simulation establish, and which claims still require hardware measurements?'}
];
const week2 = [
{title:'Lock the baseline',short:'Baseline',owner:'Spencer + Sisi',goal:'Start with a reproducible result and a shared contract. Close Week 1 gaps before adding features.',tasks:[['Reproduce the Week 1 demo','Run reset and one valid message from a clean simulation build. Record the command, tool versions, and source revision.'],['Freeze the parser boundary','Review message fields, lane order, final-byte mask, reset, error policy, and output latency. Write down what the upstream adapter guarantees.'],['Review the board evidence together','Sisi records the actual IP configuration, port/lane, clocks, reset, tools/licenses, and current blocker. Separate observed facts from assumptions.']],evidence:'One clean baseline run, a versioned interface contract, and a board-status note.',question:'If the Python reference and RTL agree, what independent evidence would expose a shared byte-order mistake?'},
{title:'Verify continuous traffic',short:'Streaming',owner:'Spencer · RTL + cocotb',goal:'Show that the parser handles a stream, not just an isolated message. Keep expected results independent of the DUT.',tasks:[['Predict the transfers by hand','Use distinct field values across consecutive payloads. Mark every accepted transfer and the expected decoded-valid edge.'],['Check ordering and output count','Exercise consecutive payloads and input gaps against the Python reference. Check fields, one result per accepted message, and the documented latency.'],['Verify reset and malformed-input recovery','Cover reset mid-payload, short/long inputs, unsupported types, illegal masks, and final error status. Follow each rejection with a valid payload.']],evidence:'A self-checking regression and an annotated trace of consecutive messages plus recovery.',question:'Which test would catch stale data from one message leaking into the next, even if output-valid timing looks correct?'},
{title:'Measure parser latency',short:'Measurement',owner:'Spencer · instrumentation',goal:'Turn an informal “it looks fast” into a repeatable measurement with unambiguous boundaries.',tasks:[['Define the measurement edges','Use the edge accepting the final payload transfer as the start and the decoded-valid edge as the end. Document sampling phase and clock period.'],['Collect a baseline across traffic cases','Record message ID, stimulus case, start cycle, end cycle, and latency in cycles. Compare continuous input and input gaps.'],['Check the measurement itself','Reconcile at least one row against the waveform by hand. Report clock-period assumptions and distinguish processing latency from first-byte-to-result time.']],evidence:'A small latency table, the run command, and one hand-checked waveform example. Label all results as simulation.',question:'If you insert idle cycles before the final transfer, should final-transfer-to-result latency change? What about first-byte-to-result time?'},
{title:'Prepare the hardware handoff',short:'Integration',owner:'Spencer + Sisi',goal:'Make the gap between your payload-only parser and the real receive interface explicit.',tasks:[['Compare the two interfaces','List actual RX width, byte-lane order, valid-byte rules, final marker, error timing, and clock/reset behavior. Mark every unverified item.'],['Specify the upstream adapter','Draw where Ethernet/IP/UDP headers are handled and application payload begins. Record framing and width-conversion responsibilities without assuming the MAC emits quotes.'],['Make one bring-up step reproducible','Sisi demonstrates the next achievable IP/example milestone, or records a precise blocker and next action. Hardware loopback is stretch if prerequisites are ready.']],evidence:'An interface comparison, adapter boundary sketch, and a reproducible board result or actionable blocker note.',question:'What would go wrong if a payload parser interpreted the first Ethernet-frame byte as the start of your quote message?'},
{title:'Demo, explain, choose next',short:'Review',owner:'Spencer + Sisi',goal:'Finish the week with evidence another person can reproduce and a small, explicit next milestone.',tasks:[['Rerun and package the evidence','Run the regression cleanly and address meaningful lint warnings. Save the source revision, commands, test summary, trace, and latency table.'],['Give a five-minute demonstration','Show a valid stream, malformed-to-valid recovery, and a measured latency row. Both partners explain the receive path and remaining integration gap.'],['Agree on Week 3 from the results','Record what passed, what is untested, and the largest blocker. Choose one measurable next step, such as an upstream adapter or a supported loopback baseline.']],evidence:'A short review note linking the five deliverables, known limits, and one agreed next milestone.',question:'What can you claim from these results today, and what extra evidence would you need before claiming wire-to-decision latency?'}
];
const config={1:{number:'01',title:'Understand the path.',subtitle:'From networking basics to your first streaming-parser demonstration.',label:'Understand & parse',home:'Trace the receive path. Build one checked parser.',goal:'One parser demo + a clear board status.',pipeline:['Receive path','Payload','Parser'],plan:week1,source:'libfile_d42fd1b666608191beb32db3cfa32b62'},2:{number:'02',title:'Make the stream work.',subtitle:'Verify consecutive messages, measure parser latency, and prepare the hardware handoff.',label:'Verify & measure',home:'Verify the stream. Measure a repeatable baseline.',goal:'A regression + a latency baseline.',pipeline:['Payload','Parser','Quote'],plan:week2,source:'libfile_d42fd1b666608191beb32db3cfa32b62'}};
const $=s=>document.querySelector(s),key=n=>'vcu118-week'+String(n).padStart(2,'0')+'-v1';let storageOK=true;const states={};for(const n of [1,2]){let s;try{s=JSON.parse(localStorage.getItem(key(n))||'null')}catch{storageOK=false}states[n]={checked:s?.checked&&typeof s.checked==='object'?s.checked:{},notes:s?.notes&&typeof s.notes==='object'?s.notes:{},selected:Number.isInteger(s?.selected)&&s.selected>=0&&s.selected<5?s.selected:0};}
let activeWeek=0,timer;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(n){try{localStorage.setItem(key(n),JSON.stringify(states[n]));storageOK=true}catch{storageOK=false}document.querySelectorAll('.saved').forEach(x=>x.textContent=storageOK?'Saved in this browser':'Storage unavailable · this visit only')}
function count(n,d){return config[n].plan[d].tasks.filter((_,t)=>states[n].checked[d+'-'+t]).length}function total(n){return config[n].plan.reduce((v,_,d)=>v+count(n,d),0)}function ring(n){const v=total(n),r=23,c=2*Math.PI*r;return '<div class="ring" role="img" aria-label="Week '+n+': '+v+' of 15 tasks checked"><svg viewBox="0 0 58 58"><circle class="ring-bg" cx="29" cy="29" r="23"/><circle class="ring-value" cx="29" cy="29" r="23" stroke-dasharray="'+c+'" stroke-dashoffset="'+c*(1-v/15)+'"/><text x="29" y="33" text-anchor="middle">'+Math.round(v/15*100)+'%</text></svg></div>'}
function art(n){return n===1?'<svg viewBox="0 0 480 140" role="img" aria-label="Conceptual receive path: network, reusable link IP, then your parser"><path d="M60 75H420" stroke="#b6c6a4" stroke-width="1.5" stroke-dasharray="4 5"/><g fill="#f6f8ef" stroke="#bccaac"><rect x="14" y="48" width="106" height="53" rx="8"/><rect x="176" y="35" width="128" height="80" rx="8"/><rect x="360" y="48" width="106" height="53" rx="8"/></g><rect x="184" y="43" width="112" height="64" rx="5" fill="#d4e2c3"/><g fill="#435e35" text-anchor="middle" font-size="11"><text x="67" y="80">NETWORK</text><text x="240" y="73">LINK IP</text><text x="240" y="91" font-size="8">GTY · PCS · MAC</text><text x="413" y="80">PARSER</text></g><g fill="#8ba572"><circle cx="145" cy="75" r="3"/><circle cx="330" cy="75" r="3"/></g><text x="240" y="134" text-anchor="middle" font-size="8" fill="#7e906d">UNDERSTAND THE BOUNDARIES</text></svg>':'<svg viewBox="0 0 480 140" role="img" aria-label="Conceptual timing trace from input transfers through parser to a checked result"><g stroke="#c3d0b6" stroke-width=".7"><path d="M22 36H456M22 76H456M22 116H456"/><path d="M70 20V127M155 20V127M240 20V127M325 20V127M410 20V127" stroke-dasharray="3 4"/></g><path d="M22 56h38V31h38v25h38V31h38v25h38V31h38v25h38V31h38v25h38V31h38v25h54" fill="none" stroke="#6b8954" stroke-width="1.8"/><rect x="240" y="70" width="85" height="21" rx="4" fill="#9fbc80"/><rect x="325" y="102" width="85" height="21" rx="4" fill="#344e31"/><text x="282" y="84" text-anchor="middle" fill="#415b34" font-size="8">FINAL INPUT</text><text x="367" y="116" text-anchor="middle" fill="#eaf2e1" font-size="8">RESULT</text><path d="M248 66V17H403V98" fill="none" stroke="#78985d" stroke-width="1"/><text x="325" y="12" text-anchor="middle" font-size="8" fill="#71865c">MEASURE IN CLOCK CYCLES</text></svg>'}
function footer(){return '<footer class="bottom-note"><span>Spencer + Sisi <span style="padding:0 7px">/</span> VCU118 research</span><span>Progress & notes stay in your browser <span style="padding:0 7px">·</span> <a href="https://github.com/spenchh/10GbE-FPGA-Datapath" target="_blank" rel="noopener">GitHub ↗</a></span></footer>'}
function home(){activeWeek=0;document.title='VCU118 Research';$('#app').innerHTML='<section><div class="eyebrow"><span class="dot"></span>The research workspace</div><div class="intro"><h1>Understand.<br>Build. <span>Measure.</span></h1><p>A working market-data datapath.<br>Reproducible evidence, one week at a time.</p></div><div class="meta"><span>PLATFORM <b>VCU118</b></span><span>TEAM <b>SPENCER + SISI</b></span><span class="top-home-meta">TARGET <b>JUNE 2027</b></span></div></section><div class="section-label"><h2>Choose a week</h2><span>02 PLANS · '+(total(1)+total(2))+'/30 TASKS CHECKED</span></div><div class="week-grid">'+[1,2].map(n=>'<a class="week-card" href="#week-'+n+'" aria-label="Open Week '+n+': '+config[n].label+'"><div class="card-visual"><div class="visual-label">'+(n===1?'01 / THE RECEIVE PATH':'02 / THE TIMING BASELINE')+'</div>'+art(n)+'</div><div class="card-body"><div><div class="eyebrow">Week '+config[n].number+'</div><h3>'+config[n].label+'</h3><p>'+config[n].home+'</p></div>'+ring(n)+'<div class="card-bottom" style="grid-column:1/-1"><span>5 DAYS</span><span>15 TASKS</span><span>'+total(n)+' CHECKED</span><span class="open-arrow" aria-hidden="true">↗</span></div></div></a>').join('')+'</div><div class="section-label"><h2>The path ahead</h2><span>PROJECT DIRECTION</span></div><div class="path">'+[['01','Understand','Trace the full receive path.'],['02','Parse','Decode a defined message.'],['03','Verify','Check behavior and recovery.'],['04','Measure','Record precise boundaries.'],['05','Integrate','Connect to hardware evidence.']].map(([v,t,p])=>'<div class="stage"><div class="stage-icon">'+v+'</div><h3>'+t+'</h3><p>'+p+'</p></div>').join('')+'</div><p class="soft-line">The full research and write-up are due June 2027. These first two weeks establish the baseline.</p>'+footer()}
function weekly(n){activeWeek=n;const c=config[n];document.title='Week '+c.number+' | VCU118 Research';$('#app').innerHTML='<a class="back" href="#home">← All weeks</a><section class="week-heading"><div><div class="eyebrow">Week '+c.number+' / '+c.label+'</div><h1>'+c.title+'</h1><p>'+c.subtitle+'</p></div><div class="week-actions"><button class="btn" id="print">Print plan ↗</button><a class="btn" href="#week-'+(n===1?2:1)+'">Week '+(n===1?'02':'01')+' →</a></div></section><section class="week-visual"><div><div class="eyebrow">The finish line</div><h2>'+c.goal+'</h2><p>Five milestone days · about 2–3 focused hours per day</p></div><div class="pipeline" aria-label="Week '+n+' conceptual boundary">'+c.pipeline.map((x,i)=>'<div class="pipe-node '+(i===1?'strong':'')+'">'+x+'</div>'+(i<2?'<span class="pipe-arrow" aria-hidden="true">→</span>':'')).join('')+'</div><div class="progress-stat" id="week-progress"></div></section><div class="day-nav" role="tablist" aria-label="Week '+n+' milestone days"></div><div class="day-layout"><article class="task-panel" id="day-panel" role="tabpanel"></article><div class="day-side"><section class="side-card"><div class="thought-icon" aria-hidden="true">?</div><div class="eyebrow">Think before you run</div><p id="question" style="margin-top:12px"></p></section><section class="side-card"><div class="eyebrow">Leave a trail</div><label class="notes-label" for="notes">Evidence / blockers for this day</label><textarea id="notes" placeholder="Run command, result, trace location, or the next blocker…"></textarea><div class="saved">Saved in this browser</div></section></div></div><div class="finish"><span>Check a task after its evidence exists. Expand any task for details.</span><button class="btn dark" id="next">Next unfinished day →</button></div><details class="source-note"><summary>Scope & source notes</summary><p>'+ (n===1?'Week 1 follows your original assignment: architecture, message format, Python reference, streaming contract, parser implementation, and partner review.':'Week 2 continues that assignment. Reproduce the Week 1 baseline and close its gaps before advancing. The plan is proposed work, not a record of finished research.')+'</p><p>Local exercise: 32-bit application-payload stream, one clock domain, no input-ready signal, low-byte-first lanes, final-byte mask and final error status, synchronous active-high reset, and an always-ready result consumer. Use the agreed deterministic output latency. The 10 ns scaffold clock is a simulation setting, not demonstrated board timing.</p><p>Check the real IP configuration before integration. The 64-bit FIFO needs a documented adapter for this 32-bit interface. Wire-to-decision measurements and later architecture comparisons require additional hardware evidence. Keep simulation moving if board access is blocked.</p><p><a href="https://chatgpt.com/library?file_id='+c.source+'&account_id=personal" target="_blank" rel="noopener">Week 1 source assignment ↗</a> · Original document access is required.</p></details><div class="print-days" id="print-days"></div>'+footer()+'<div style="text-align:right;margin-top:8px"><button class="reset" id="reset">Reset Week '+c.number+'</button></div>';$('#print').onclick=()=>window.print();$('#next').onclick=()=>{const d=c.plan.findIndex((_,i)=>count(n,i)<3);if(d<0){toast('All tasks checked. Review your evidence before closing the week.');return}states[n].selected=d;save(n);renderDay(n);$('#day-'+d).focus();$('#day-panel').scrollIntoView({block:'start'})};$('#reset').onclick=()=>{if(confirm('Reset all Week '+n+' checkmarks and notes in this browser?')){states[n]={checked:{},notes:{},selected:0};save(n);renderDay(n);toast('Week '+n+' reset.')}};renderDay(n)}
function renderTabs(n){$('.day-nav').innerHTML=config[n].plan.map((d,i)=>'<button class="day-tab '+(states[n].selected===i?'active':'')+'" role="tab" id="day-'+i+'" aria-controls="day-panel" aria-selected="'+(states[n].selected===i)+'" tabindex="'+(states[n].selected===i?0:-1)+'"><span class="num">'+(count(n,i)===3?'✓':String(i+1).padStart(2,'0'))+'</span><div><h3>'+d.short+'</h3><small>'+count(n,i)+'/3 CHECKED</small></div></button>').join('');document.querySelectorAll('.day-tab').forEach((b,i)=>{b.onclick=()=>{states[n].selected=i;save(n);renderDay(n);$('#day-'+i).focus({preventScroll:true})};b.onkeydown=e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home','End'].includes(e.key)){e.preventDefault();states[n].selected=e.key==='Home'?0:e.key==='End'?4:(i+(['ArrowRight','ArrowDown'].includes(e.key)?1:4))%5;save(n);renderDay(n);$('#day-'+states[n].selected).focus()}}});$('#week-progress').innerHTML=ring(n)+'<div><b>'+total(n)+' / 15</b><p>Tasks checked</p></div>'}
function renderDay(n){renderTabs(n);const d=states[n].selected,c=config[n].plan[d];$('#day-panel').setAttribute('aria-labelledby','day-'+d);$('#day-panel').innerHTML='<div class="task-heading"><span class="eyebrow">Day '+String(d+1).padStart(2,'0')+' / 05</span><span class="owner">'+c.owner+'</span></div><h2>'+c.title+'</h2><p class="goal">'+c.goal+'</p><div class="task-list">'+c.tasks.map(([title,detail],t)=>'<div class="task-row '+(states[n].checked[d+'-'+t]?'done':'')+'"><input type="checkbox" aria-label="'+esc(title)+'" '+(states[n].checked[d+'-'+t]?'checked':'')+' data-task="'+t+'"><details><summary>'+esc(title)+'</summary><p>'+esc(detail)+'</p></details></div>').join('')+'</div><div class="evidence"><div class="eyebrow">Done when</div><p>'+c.evidence+'</p></div>';$('#question').textContent=c.question;$('#notes').value=typeof states[n].notes[d]==='string'?states[n].notes[d]:'';$('#notes').oninput=e=>{states[n].notes[d]=e.target.value;save(n);renderPrint(n)};document.querySelectorAll('[data-task]').forEach(input=>input.onchange=()=>{states[n].checked[d+'-'+input.dataset.task]=input.checked;input.closest('.task-row').classList.toggle('done',input.checked);save(n);renderTabs(n);renderPrint(n)});$('.saved').textContent=storageOK?'Saved in this browser':'Storage unavailable · this visit only';renderPrint(n)}
function renderPrint(n){$('#print-days').innerHTML=config[n].plan.map((day,d)=>'<section class="print-day"><h2>Day '+(d+1)+' · '+day.title+'</h2><p>'+day.owner+' · '+day.goal+'</p><ul>'+day.tasks.map(([t,p],i)=>'<li>'+(states[n].checked[d+'-'+i]?'☑ ':'☐ ')+t+': '+p+'</li>').join('')+'</ul><p><b>Evidence:</b> '+day.evidence+'</p>'+(states[n].notes[d]?'<p><b>Your note:</b> '+esc(states[n].notes[d])+'</p>':'')+'</section>').join('')}
function toast(s){$('#toast').textContent=s;$('#toast').classList.add('show');clearTimeout(timer);timer=setTimeout(()=>$('#toast').classList.remove('show'),2300)}function route(){const h=location.hash.slice(1);const n=h==='week-1'?1:h==='week-2'?2:0;document.querySelectorAll('[data-nav]').forEach(a=>{const yes=a.dataset.nav===(n?'week-'+n:'home');a.classList.toggle('active',yes);if(yes)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});n?weekly(n):home();window.scrollTo(0,0)}window.addEventListener('hashchange',route);window.addEventListener('storage',e=>{for(const n of [1,2]){if(e.key===key(n)){try{const s=JSON.parse(e.newValue||'null');states[n]={checked:s?.checked||{},notes:s?.notes||{},selected:Number.isInteger(s?.selected)&&s.selected>=0&&s.selected<5?s.selected:0}}catch{}activeWeek?renderDay(activeWeek):home();}}});route();
</script></body></html>
